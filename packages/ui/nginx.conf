server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html index.htm;

  # Browser security headers, applied to static and proxied responses (location
  # blocks define no add_header of their own, so these are inherited). `always`
  # keeps them on error responses too.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  # Intentionally NOT set here: X-Frame-Options / CSP frame-ancestors would break
  # the Lite embed (iframe) profile, and a content CSP needs per-deployment tuning
  # for the SPA (Monaco workers, inline styles) — set those at the edge proxy.

  # Cap request bodies (covers /graphql dashboard saves); generous enough for
  # large dashboards while bounding abuse. Tune per deployment.
  client_max_body_size 5m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /graphql {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://freeboard-api:4001;
  }

  location /gateway {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://freeboard-gateway:8001;
  }
}
