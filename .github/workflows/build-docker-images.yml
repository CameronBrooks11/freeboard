name: Build & publish docker images
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  MAINLINE_NODE_IMAGE: node:24.13.1-alpine
  LEGACY_ARMV7_NODE_IMAGE: node:22.22.0-alpine3.23
  NPM_VERSION: 11.10.0

# Intentionally no cancel-in-progress concurrency for publish builds:
# rapid sequential pushes can otherwise skip changed-image publishes.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            dockerfile: ./packages/api/Dockerfile
            package_path: packages/api
            image: ghcr.io/cameronbrooks11/freeboard-api
            name: api
          - context: .
            dockerfile: ./packages/gateway/Dockerfile
            package_path: packages/gateway
            image: ghcr.io/cameronbrooks11/freeboard-gateway
            name: gateway
          - context: .
            dockerfile: ./packages/ui/Dockerfile
            package_path: packages/ui
            image: ghcr.io/cameronbrooks11/freeboard-ui
            name: ui

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine if package has changed
        id: changes
        shell: bash
        run: |
          echo "Checking for changes in ${{ matrix.package_path }} for event '${{ github.event_name }}'"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch: forcing rebuild for ${{ matrix.package_path }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "No usable 'before' SHA from event payload; deriving from commit parent."
            if git rev-parse "${CURRENT_SHA}^" >/dev/null 2>&1; then
              BEFORE_SHA="$(git rev-parse "${CURRENT_SHA}^")"
            else
              echo "No parent commit available; forcing rebuild for safety."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          if [[ "${#CHANGED_FILES[@]}" -eq 0 ]]; then
            echo "No changed files detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PACKAGE_CHANGED=false
          for file in "${CHANGED_FILES[@]}"; do
            if [[ "$file" == "${{ matrix.package_path }}"/* ]]; then
              PACKAGE_CHANGED=true
              break
            fi
            if [[ "$file" == packages/shared/* ]]; then
              if [[ "${{ matrix.name }}" == "api" || "${{ matrix.name }}" == "gateway" ]]; then
                PACKAGE_CHANGED=true
                break
              fi
            fi
            case "$file" in
              package.json|package-lock.json|.dockerignore)
                PACKAGE_CHANGED=true
                break
                ;;
            esac
          done

          if [[ "$PACKAGE_CHANGED" == "true" ]]; then
            echo "Changes detected affecting ${{ matrix.package_path }} build."
            printf '%s\n' "${CHANGED_FILES[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant changes for ${{ matrix.package_path }}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Log in to the Container registry
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Resolve package version
        if: steps.changes.outputs.changed == 'true'
        id: package
        shell: bash
        run: |
          VERSION="$(node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('${{ matrix.package_path }}/package.json','utf8')); process.stdout.write(String(pkg.version || ''));")"
          if [[ -z "$VERSION" ]]; then
            echo "Failed to resolve version from ${{ matrix.package_path }}/package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package version for ${{ matrix.name }}: v$VERSION"

      - name: Extract metadata (tags, labels) for Docker
        if: steps.changes.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.package.outputs.version }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=freeboard-${{ matrix.name }}
            org.opencontainers.image.description=Freeboard ${{ matrix.name }} service image
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.package.outputs.version }}

      - name: Extract metadata (tags, labels) for Docker armv7 legacy track
        if: steps.changes.outputs.changed == 'true'
        id: meta_armv7
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest-armv7
            type=raw,value=v${{ steps.package.outputs.version }}-armv7
            type=sha,format=short,prefix=sha-,suffix=-armv7
          labels: |
            org.opencontainers.image.title=freeboard-${{ matrix.name }}-armv7
            org.opencontainers.image.description=Freeboard ${{ matrix.name }} service image (legacy armv7)
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.package.outputs.version }}-armv7

      - name: Build and push Docker image (mainline amd64/arm64)
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          # Mainline publish track: current runtime baseline.
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            NODE_IMAGE=${{ env.MAINLINE_NODE_IMAGE }}
            NPM_VERSION=${{ env.NPM_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image (legacy armv7)
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          # Legacy compatibility lane for 32-bit Raspberry Pi deployments.
          platforms: linux/arm/v7
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            NODE_IMAGE=${{ env.LEGACY_ARMV7_NODE_IMAGE }}
            NPM_VERSION=${{ env.NPM_VERSION }}
          push: true
          tags: ${{ steps.meta_armv7.outputs.tags }}
          labels: ${{ steps.meta_armv7.outputs.labels }}

      - name: Skipping build (no changes)
        if: steps.changes.outputs.changed == 'false'
        run: echo "No changes detected in ${{ matrix.name }} — skipping build."
