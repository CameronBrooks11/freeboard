name: Docker image smoke
on:
  pull_request:
    paths:
      - "packages/api/**"
      - "packages/gateway/**"
      - "packages/shared/**"
      - "packages/core/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/docker-image-smoke.mjs"
      - ".github/workflows/docker-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Smoke api & gateway runtime images
        run: node scripts/docker-image-smoke.mjs
