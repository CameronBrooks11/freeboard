name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      non_docs: ${{ steps.classify.outputs.non_docs }}
      run_format_check: ${{ steps.classify.outputs.run_format_check }}
      run_docs_integrity: ${{ steps.classify.outputs.run_docs_integrity }}
      run_api_tests: ${{ steps.classify.outputs.run_api_tests }}
      run_shared_tests: ${{ steps.classify.outputs.run_shared_tests }}
      run_ui_tests: ${{ steps.classify.outputs.run_ui_tests }}
      run_gateway_tests: ${{ steps.classify.outputs.run_gateway_tests }}
      run_e2e_smoke: ${{ steps.classify.outputs.run_e2e_smoke }}
      run_build_verify: ${{ steps.classify.outputs.run_build_verify }}
      run_typecheck: ${{ steps.classify.outputs.run_typecheck }}
      run_docker_sanity: ${{ steps.classify.outputs.run_docker_sanity }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'planning/**'
              - '**/*.md'
              - 'LICENSE'
            docs_site:
              - 'docs/**'
              - 'scripts/check-docs-manual-sidebar.mjs'
              - 'scripts/check-docs-i18n.mjs'
            api:
              - 'packages/api/src/**'
              - 'packages/api/test/**'
              - 'packages/api/tsconfig*.json'
              - 'packages/api/package.json'
              - 'packages/api/Dockerfile'
            ui:
              - 'packages/ui/src/**'
              - 'packages/ui/test/**'
              - 'packages/ui/tsconfig*.json'
              - 'packages/ui/package.json'
              - 'packages/ui/vite.config.mjs'
              - 'packages/ui/index.html'
              - 'packages/ui/nginx.conf'
              - 'packages/ui/Dockerfile'
            gateway:
              - 'packages/gateway/src/**'
              - 'packages/gateway/test/**'
              - 'packages/gateway/tsconfig*.json'
              - 'packages/gateway/package.json'
              - 'packages/gateway/Dockerfile'
            docker_sanity:
              - 'packages/api/Dockerfile'
              - 'packages/gateway/Dockerfile'
              - 'packages/ui/Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/api/package.json'
              - 'packages/gateway/package.json'
              - 'packages/ui/package.json'
              - 'packages/shared/package.json'
            e2e:
              - 'e2e/**'
              - 'scripts/e2e-smoke.mjs'
              - 'playwright.e2e.config.mjs'
              - 'docker-compose.mongo.yml'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.env.dev'
              - '.github/workflows/ci.yml'
            runtime_shared:
              - 'packages/shared/**'
            shared:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.nvmrc'
              - '.editorconfig'
              - '.prettier*'
              - '.pre-commit-config.yaml'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'eslint.config.*'
              - 'codegen.yml'
              - 'docker-compose*.yml'

      - name: Classify CI jobs
        id: classify
        shell: bash
        run: |
          docs="${{ steps.filter.outputs.docs }}"
          docs_site="${{ steps.filter.outputs.docs_site }}"
          api="${{ steps.filter.outputs.api }}"
          ui="${{ steps.filter.outputs.ui }}"
          gateway="${{ steps.filter.outputs.gateway }}"
          docker_sanity="${{ steps.filter.outputs.docker_sanity }}"
          e2e="${{ steps.filter.outputs.e2e }}"
          runtime_shared="${{ steps.filter.outputs.runtime_shared }}"
          shared="${{ steps.filter.outputs.shared }}"

          non_docs=false
          if [[ "$api" == "true" || "$ui" == "true" || "$gateway" == "true" || "$runtime_shared" == "true" || "$shared" == "true" ]]; then
            non_docs=true
          fi

          docs_only=false
          if [[ "$docs" == "true" && "$non_docs" == "false" ]]; then
            docs_only=true
          fi

          run_api_tests=false
          if [[ "$api" == "true" || "$runtime_shared" == "true" || "$shared" == "true" ]]; then
            run_api_tests=true
          fi

          run_ui_tests=false
          if [[ "$ui" == "true" || "$shared" == "true" ]]; then
            run_ui_tests=true
          fi

          run_shared_tests=false
          if [[ "$runtime_shared" == "true" || "$shared" == "true" ]]; then
            run_shared_tests=true
          fi

          run_gateway_tests=false
          if [[ "$gateway" == "true" || "$runtime_shared" == "true" || "$shared" == "true" ]]; then
            run_gateway_tests=true
          fi

          run_e2e_smoke=false
          if [[ "$e2e" == "true" || "$api" == "true" || "$ui" == "true" || "$gateway" == "true" || "$runtime_shared" == "true" ]]; then
            run_e2e_smoke=true
          fi

          run_build_verify=false
          if [[ "$api" == "true" || "$ui" == "true" || "$gateway" == "true" || "$runtime_shared" == "true" || "$shared" == "true" ]]; then
            run_build_verify=true
          fi

          run_typecheck=false
          if [[ "$api" == "true" || "$ui" == "true" || "$gateway" == "true" || "$runtime_shared" == "true" || "$shared" == "true" ]]; then
            run_typecheck=true
          fi

          run_docker_sanity=false
          if [[ "$docker_sanity" == "true" ]]; then
            run_docker_sanity=true
          fi

          run_format_check=true
          run_docs_integrity=false
          if [[ "$docs_site" == "true" ]]; then
            run_docs_integrity=true
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "non_docs=$non_docs" >> "$GITHUB_OUTPUT"
          echo "run_format_check=$run_format_check" >> "$GITHUB_OUTPUT"
          echo "run_docs_integrity=$run_docs_integrity" >> "$GITHUB_OUTPUT"
          echo "run_api_tests=$run_api_tests" >> "$GITHUB_OUTPUT"
          echo "run_shared_tests=$run_shared_tests" >> "$GITHUB_OUTPUT"
          echo "run_ui_tests=$run_ui_tests" >> "$GITHUB_OUTPUT"
          echo "run_gateway_tests=$run_gateway_tests" >> "$GITHUB_OUTPUT"
          echo "run_e2e_smoke=$run_e2e_smoke" >> "$GITHUB_OUTPUT"
          echo "run_build_verify=$run_build_verify" >> "$GITHUB_OUTPUT"
          echo "run_typecheck=$run_typecheck" >> "$GITHUB_OUTPUT"
          echo "run_docker_sanity=$run_docker_sanity" >> "$GITHUB_OUTPUT"

          echo "CI classification:"
          echo "  docs_only=$docs_only"
          echo "  docs_site=$docs_site"
          echo "  non_docs=$non_docs"
          echo "  run_format_check=$run_format_check"
          echo "  run_docs_integrity=$run_docs_integrity"
          echo "  run_api_tests=$run_api_tests"
          echo "  run_shared_tests=$run_shared_tests"
          echo "  run_ui_tests=$run_ui_tests"
          echo "  run_gateway_tests=$run_gateway_tests"
          echo "  run_e2e_smoke=$run_e2e_smoke"
          echo "  run_build_verify=$run_build_verify"
          echo "  run_typecheck=$run_typecheck"
          echo "  run_docker_sanity=$run_docker_sanity"
          echo "  runtime_shared=$runtime_shared"

  format:
    name: Format check
    needs: changes
    if: needs.changes.outputs.run_format_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check

  docs-integrity:
    name: Docs integrity
    needs: changes
    if: needs.changes.outputs.run_docs_integrity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate manual sidebar coverage
        run: npm run check:docs:manual-sidebar
      - name: Validate docs i18n integrity
        run: npm run check:docs:i18n

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate UI store boundaries
        run: npm run check:ui:store-boundaries
      - name: Validate UI theme contrast
        run: npm run check:ui:theme-contrast
      - name: Validate UI i18n parity
        run: npm run check:ui:i18n-parity
      - name: Validate UI i18n composition-mode lock
        run: npm run check:ui:i18n-composition-mode
      - name: Validate TS source debt
        run: npm run check:ts:debt
      - name: Validate TS source artifacts
        run: npm run check:ts:source-artifacts
      - name: Validate runtime dependency hygiene
        run: npm run check:runtime-deps

  test-api:
    name: Test API
    needs: changes
    if: needs.changes.outputs.run_api_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Run API tests
        run: npm run test:api

  test-shared:
    name: Test Shared
    needs: changes
    if: needs.changes.outputs.run_shared_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Run shared tests
        run: npm run test:shared

  test-ui:
    name: Test UI runtime
    needs: changes
    if: needs.changes.outputs.run_ui_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Run UI tests
        run: npm run test:ui

  test-gateway:
    name: Test Gateway
    needs: changes
    if: needs.changes.outputs.run_gateway_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Run gateway tests
        run: npm run test:gateway

  test-e2e-smoke:
    name: Test E2E smoke
    needs: changes
    if: needs.changes.outputs.run_e2e_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare e2e env
        run: cp .env.dev .env
      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Run smoke E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_URL: http://127.0.0.1:4001/graphql
          E2E_GATEWAY_URL: http://127.0.0.1:8001
        run: npm run test:e2e:smoke
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  build-verify:
    name: Build verify
    needs: changes
    if: needs.changes.outputs.run_build_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build verify
        run: npm run build:verify

  docker-sanity:
    name: Docker build sanity
    needs: changes
    if: needs.changes.outputs.run_docker_sanity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f packages/api/Dockerfile . -t freeboard-api-ci:pr
      - name: Build Gateway image
        run: docker build -f packages/gateway/Dockerfile . -t freeboard-gateway-ci:pr
      - name: Build UI image
        run: docker build -f packages/ui/Dockerfile . -t freeboard-ui-ci:pr

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.run_typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  required:
    name: Required CI
    if: always()
    needs:
      - changes
      - format
      - docs-integrity
      - lint
      - test-api
      - test-shared
      - test-ui
      - test-gateway
      - test-e2e-smoke
      - build-verify
      - docker-sanity
      - typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required results
        shell: bash
        run: |
          status=0

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Required job failed: changes (result=${{ needs.changes.result }})"
            exit 1
          fi

          check_required() {
            local should_run="$1"
            local result="$2"
            local label="$3"
            if [[ "$should_run" == "true" && "$result" != "success" ]]; then
              echo "Required job failed: $label (result=$result)"
              status=1
            else
              echo "Job ok: $label (should_run=$should_run, result=$result)"
            fi
          }

          check_required "${{ needs.changes.outputs.run_format_check }}" "${{ needs.format.result }}" "format"
          check_required "${{ needs.changes.outputs.run_docs_integrity }}" "${{ needs.docs-integrity.result }}" "docs-integrity"
          check_required "${{ needs.changes.outputs.non_docs }}" "${{ needs.lint.result }}" "lint"
          check_required "${{ needs.changes.outputs.run_api_tests }}" "${{ needs.test-api.result }}" "test-api"
          check_required "${{ needs.changes.outputs.run_shared_tests }}" "${{ needs.test-shared.result }}" "test-shared"
          check_required "${{ needs.changes.outputs.run_ui_tests }}" "${{ needs.test-ui.result }}" "test-ui"
          check_required "${{ needs.changes.outputs.run_gateway_tests }}" "${{ needs.test-gateway.result }}" "test-gateway"
          check_required "${{ needs.changes.outputs.run_e2e_smoke }}" "${{ needs.test-e2e-smoke.result }}" "test-e2e-smoke"
          check_required "${{ needs.changes.outputs.run_build_verify }}" "${{ needs.build-verify.result }}" "build-verify"
          check_required "${{ needs.changes.outputs.run_docker_sanity }}" "${{ needs.docker-sanity.result }}" "docker-sanity"
          check_required "${{ needs.changes.outputs.run_typecheck }}" "${{ needs.typecheck.result }}" "typecheck"

          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
