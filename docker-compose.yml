services:
  freeboard-ui:
    image: ghcr.io/cameronbrooks11/freeboard-ui:${FREEBOARD_UI_IMAGE_TAG:-latest}
    restart: unless-stopped
    container_name: freeboard-ui
    ports:
      - 8080:8080
    networks:
      - freeboard
    depends_on:
      - freeboard-api
      - freeboard-gateway

  freeboard-api:
    restart: unless-stopped
    container_name: freeboard-api
    image: ghcr.io/cameronbrooks11/freeboard-api:${FREEBOARD_API_IMAGE_TAG:-latest}
    environment:
      - DB_BACKEND=postgres
      - DATABASE_URL=${FREEBOARD_POSTGRES_URL:-}
      - NODE_ENV=${FREEBOARD_RUNTIME_ENV:-production}
      - API_TRUST_PROXY_HOPS=${API_TRUST_PROXY_HOPS:-0}
      - SECURITY_LIMITER_BACKEND=${SECURITY_LIMITER_BACKEND:-postgres}
      - SECURITY_LIMITER_FAILURE_MODE=${SECURITY_LIMITER_FAILURE_MODE:-fail-closed}
      - SECURITY_LIMITER_NAMESPACE=${SECURITY_LIMITER_NAMESPACE:-freeboard:security-limiter}
      - SECURITY_LIMITER_HASH_SALT=${SECURITY_LIMITER_HASH_SALT:-}
      - SECURITY_LIMITER_MEMORY_MAX_KEYS=${SECURITY_LIMITER_MEMORY_MAX_KEYS:-10000}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env for containerized deployments}
      - JWT_GATEWAY_SECRET=${JWT_GATEWAY_SECRET:?Set JWT_GATEWAY_SECRET in .env for containerized deployments}
      - GATEWAY_SERVICE_TOKEN=${GATEWAY_SERVICE_TOKEN:?Set GATEWAY_SERVICE_TOKEN in .env for containerized deployments}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env for containerized deployments}
      - JWT_TIME_EXPIRATION=${JWT_TIME_EXPIRATION:-2h}
      - USER_LIMIT=${USER_LIMIT:-0}
      - CREATE_ADMIN=${CREATE_ADMIN:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - FETCH_TIMEOUT_MS=${FETCH_TIMEOUT_MS:-15000}
      - FETCH_MAX_RESPONSE_BYTES=${FETCH_MAX_RESPONSE_BYTES:-5242880}
      - DATASOURCE_TOKEN_MINT_RATE_LIMIT_USER_PER_MIN=${DATASOURCE_TOKEN_MINT_RATE_LIMIT_USER_PER_MIN:-60}
      - DATASOURCE_TOKEN_MINT_RATE_LIMIT_PUBLIC_IP_PER_MIN=${DATASOURCE_TOKEN_MINT_RATE_LIMIT_PUBLIC_IP_PER_MIN:-30}
      - DATASOURCE_TOKEN_MINT_RATE_LIMIT_SHARE_TOKEN_PER_MIN=${DATASOURCE_TOKEN_MINT_RATE_LIMIT_SHARE_TOKEN_PER_MIN:-60}
      - DATASOURCE_SESSION_TTL_SECONDS=${DATASOURCE_SESSION_TTL_SECONDS:-300}
      - GATEWAY_INTROSPECTION_RATE_LIMIT_PER_MIN=${GATEWAY_INTROSPECTION_RATE_LIMIT_PER_MIN:-600}
      - GATEWAY_REVOKED_TOKENS_RATE_LIMIT_PER_MIN=${GATEWAY_REVOKED_TOKENS_RATE_LIMIT_PER_MIN:-600}
      - GATEWAY_REVOKED_TOKENS_MAX_BATCH=${GATEWAY_REVOKED_TOKENS_MAX_BATCH:-500}
      - REALTIME_REVOKE_EVENT_RETENTION_SECONDS=${REALTIME_REVOKE_EVENT_RETENTION_SECONDS:-86400}
    networks:
      - freeboard
  freeboard-gateway:
    restart: unless-stopped
    container_name: freeboard-gateway
    image: ghcr.io/cameronbrooks11/freeboard-gateway:${FREEBOARD_GATEWAY_IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=${FREEBOARD_RUNTIME_ENV:-production}
      - EGRESS_ALLOWED_HOSTS=${EGRESS_ALLOWED_HOSTS:?Set EGRESS_ALLOWED_HOSTS in .env for containerized deployments}
      - EGRESS_ALLOWED_PORTS=${EGRESS_ALLOWED_PORTS:-80,443,1883,8883}
      - EGRESS_ALLOW_PRIVATE_DESTINATIONS=${EGRESS_ALLOW_PRIVATE_DESTINATIONS:-false}
      - EGRESS_ALLOW_INSECURE_TLS=${EGRESS_ALLOW_INSECURE_TLS:-false}
      - FETCH_TIMEOUT_MS=${FETCH_TIMEOUT_MS:-15000}
      - FETCH_MAX_RESPONSE_BYTES=${FETCH_MAX_RESPONSE_BYTES:-5242880}
      - GATEWAY_INTROSPECTION_TIMEOUT_MS=${GATEWAY_INTROSPECTION_TIMEOUT_MS:-5000}
      - GATEWAY_REVOKED_TOKENS_TIMEOUT_MS=${GATEWAY_REVOKED_TOKENS_TIMEOUT_MS:-5000}
      - GATEWAY_LIMITER_TIMEOUT_MS=${GATEWAY_LIMITER_TIMEOUT_MS:-3000}
      - JWT_GATEWAY_SECRET=${JWT_GATEWAY_SECRET:?Set JWT_GATEWAY_SECRET in .env for containerized deployments}
      - GATEWAY_SERVICE_TOKEN=${GATEWAY_SERVICE_TOKEN:?Set GATEWAY_SERVICE_TOKEN in .env for containerized deployments}
      - GATEWAY_API_BASE_URL=${GATEWAY_API_BASE_URL:-http://freeboard-api:4001}
      - GATEWAY_REVOKED_TOKENS_MAX_BATCH=${GATEWAY_REVOKED_TOKENS_MAX_BATCH:-500}
      - REALTIME_ENABLED=${REALTIME_ENABLED:-true}
      - REALTIME_MAX_CLIENT_CONNECTIONS_PER_IP=${REALTIME_MAX_CLIENT_CONNECTIONS_PER_IP:-25}
      - REALTIME_MAX_CONNECTIONS_PER_DASHBOARD=${REALTIME_MAX_CONNECTIONS_PER_DASHBOARD:-1000}
      - REALTIME_MAX_SUBSCRIPTIONS_PER_CONNECTION=${REALTIME_MAX_SUBSCRIPTIONS_PER_CONNECTION:-50}
      - REALTIME_CONNECT_TIMEOUT_MS=${REALTIME_CONNECT_TIMEOUT_MS:-10000}
      - REALTIME_RECONNECT_MIN_MS=${REALTIME_RECONNECT_MIN_MS:-1000}
      - REALTIME_RECONNECT_MAX_MS=${REALTIME_RECONNECT_MAX_MS:-30000}
      - REALTIME_MAX_MESSAGE_BYTES=${REALTIME_MAX_MESSAGE_BYTES:-1048576}
      - REALTIME_CONNECT_RATE_LIMIT_IP_PER_MIN=${REALTIME_CONNECT_RATE_LIMIT_IP_PER_MIN:-60}
      - REALTIME_PUBLIC_SUBSCRIBE_RATE_LIMIT_IP_PER_MIN=${REALTIME_PUBLIC_SUBSCRIBE_RATE_LIMIT_IP_PER_MIN:-60}
      - REALTIME_PUBLIC_SUBSCRIBE_RATE_LIMIT_SHARE_TOKEN_PER_MIN=${REALTIME_PUBLIC_SUBSCRIBE_RATE_LIMIT_SHARE_TOKEN_PER_MIN:-120}
      - REALTIME_PUBLIC_REVALIDATE_INTERVAL_MS=${REALTIME_PUBLIC_REVALIDATE_INTERVAL_MS:-30000}
      - REALTIME_PUBLIC_FULL_REVALIDATE_INTERVAL_MS=${REALTIME_PUBLIC_FULL_REVALIDATE_INTERVAL_MS:-300000}
      - REALTIME_TRUST_PROXY_HOPS=${REALTIME_TRUST_PROXY_HOPS:-0}
      - REALTIME_LIMITER_FAILURE_MODE=${REALTIME_LIMITER_FAILURE_MODE:-fail-closed}
      - REALTIME_SSE_ENABLED=${REALTIME_SSE_ENABLED:-true}
      - REALTIME_SSE_IDLE_TIMEOUT_MS=${REALTIME_SSE_IDLE_TIMEOUT_MS:-120000}
      - REALTIME_WS_ENABLED=${REALTIME_WS_ENABLED:-true}
      - REALTIME_WS_IDLE_TIMEOUT_MS=${REALTIME_WS_IDLE_TIMEOUT_MS:-300000}
      - REALTIME_WS_PING_INTERVAL_MS=${REALTIME_WS_PING_INTERVAL_MS:-30000}
      - REALTIME_MQTT_ENABLED=${REALTIME_MQTT_ENABLED:-true}
      - REALTIME_MQTT_MAX_MESSAGE_BYTES=${REALTIME_MQTT_MAX_MESSAGE_BYTES:-262144}
      - REALTIME_MQTT_KEEPALIVE_SECONDS=${REALTIME_MQTT_KEEPALIVE_SECONDS:-60}
      - REALTIME_MQTT_ALLOWED_TOPICS=${REALTIME_MQTT_ALLOWED_TOPICS:-}
      - REALTIME_MQTT_MAX_QOS=${REALTIME_MQTT_MAX_QOS:-1}
      - REALTIME_MQTT_MAX_CONNECTIONS_PER_BROKER=${REALTIME_MQTT_MAX_CONNECTIONS_PER_BROKER:-10}
      - REALTIME_MQTT_IDLE_DISCONNECT_MS=${REALTIME_MQTT_IDLE_DISCONNECT_MS:-300000}
    networks:
      - freeboard
networks:
  freeboard:
    name: freeboard
    driver: bridge
