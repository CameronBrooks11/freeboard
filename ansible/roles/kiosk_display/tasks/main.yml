---
- name: Install display support packages
  ansible.builtin.apt:
    name: "{{ kiosk_display_packages }}"
    state: present
    update_cache: true

- name: Install preferred Chromium package
  block:
    - name: Install browser package {{ kiosk_browser_package }}
      ansible.builtin.apt:
        name: "{{ kiosk_browser_package }}"
        state: present
  rescue:
    - name: Install browser fallback package {{ kiosk_browser_package_fallback }}
      ansible.builtin.apt:
        name: "{{ kiosk_browser_package_fallback }}"
        state: present

- name: Stat existing X11 config files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ kiosk_xwrapper_config_dest }}"
    - "{{ kiosk_xorg_config_dest }}"
  register: kiosk_x11_config_stats
  when: kiosk_manage_x11_config | bool

- name: Backup existing X11 config files once
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ item.stat.path }}{{ kiosk_config_backup_suffix }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false
  loop: "{{ kiosk_x11_config_stats.results }}"
  when:
    - kiosk_manage_x11_config | bool
    - item.stat.exists

- name: Deploy managed Xwrapper.config
  ansible.builtin.copy:
    src: Xwrapper.config
    dest: "{{ kiosk_xwrapper_config_dest }}"
    owner: root
    group: root
    mode: "0644"
  when: kiosk_manage_x11_config | bool

- name: Deploy managed xorg.conf
  ansible.builtin.copy:
    src: xorg.conf
    dest: "{{ kiosk_xorg_config_dest }}"
    owner: root
    group: root
    mode: "0644"
  when: kiosk_manage_x11_config | bool
