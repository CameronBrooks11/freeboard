---
- name: Validate mongo preload runtime toggle
  ansible.builtin.assert:
    that:
      - mongo_preload_enabled | bool
    fail_msg: "mongo_preload_enabled is false. Set true to run mongo_preload role."

- name: Ensure Docker CLI is available
  ansible.builtin.command:
    cmd: docker --version
  changed_when: false

- name: Download Mongo ARM image tarball
  ansible.builtin.get_url:
    url: "{{ mongo_arm_tar_url }}"
    dest: "{{ mongo_arm_tar_path }}"
    mode: "0644"

- name: Load Mongo ARM Docker image tarball
  ansible.builtin.command:
    cmd: docker load --input {{ mongo_arm_tar_path }}
  register: mongo_docker_load
  changed_when: "'Loaded image' in mongo_docker_load.stdout"

- name: Remove Mongo ARM image tarball
  ansible.builtin.file:
    path: "{{ mongo_arm_tar_path }}"
    state: absent
