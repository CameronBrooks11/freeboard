---
- name: Deploy kiosk player script
  ansible.builtin.copy:
    src: "{{ kiosk_player_script_source }}"
    dest: "{{ kiosk_player_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Deploy kiosk runtime environment file
  ansible.builtin.template:
    src: kiosk.env.j2
    dest: "{{ kiosk_env_file_path }}"
    owner: root
    group: root
    mode: "0640"

- name: Deploy kiosk systemd unit
  ansible.builtin.template:
    src: freeboard-kiosk.service.j2
    dest: "/etc/systemd/system/{{ kiosk_service_name }}.service"
    owner: root
    group: root
    mode: "0644"

- name: Collect current service facts
  ansible.builtin.service_facts:

- name: Disable legacy freeboard service
  ansible.builtin.systemd:
    name: "{{ kiosk_legacy_service_name }}"
    state: stopped
    enabled: false
    masked: true
    daemon_reload: true
  when:
    - kiosk_disable_legacy_service | bool
    - kiosk_legacy_service_name in ansible_facts.services

- name: Enable and start kiosk player service
  ansible.builtin.systemd:
    name: "{{ kiosk_service_name }}.service"
    state: started
    enabled: true
    daemon_reload: true
