---
- name: Remove distro-packaged Docker components
  ansible.builtin.apt:
    name: "{{ container_runtime_legacy_packages }}"
    state: absent
  when: container_runtime_remove_legacy_packages

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure Docker keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Resolve Docker architecture mapping
  ansible.builtin.set_fact:
    container_runtime_repo_arch: "{{ container_runtime_arch_map[ansible_architecture] | default('') }}"

- name: Fail on unsupported architecture for Docker repository
  ansible.builtin.assert:
    that:
      - container_runtime_repo_arch | length > 0
    fail_msg: "Unsupported architecture for Docker repository setup: {{ ansible_architecture }}"

- name: Resolve Docker repository base URL
  ansible.builtin.set_fact:
    container_runtime_repo_base_url: >-
      {{ container_runtime_raspbian_repo_base_url
         if ansible_architecture in container_runtime_raspbian_architectures
         else container_runtime_debian_repo_base_url }}

- name: Download Docker repository GPG key
  ansible.builtin.get_url:
    url: "{{ container_runtime_repo_base_url }}/gpg"
    dest: /tmp/freeboard-docker.asc
    mode: "0644"

- name: Install Docker repository keyring
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /tmp/freeboard-docker.asc
    creates: /etc/apt/keyrings/docker.gpg

- name: Set Docker keyring permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ container_runtime_repo_arch }} signed-by=/etc/apt/keyrings/docker.gpg]
      {{ container_runtime_repo_base_url }} {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ container_runtime_packages }}"
    state: present
    update_cache: true

- name: Ensure runtime users are in docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - docker
    append: true
  loop: "{{ container_runtime_users }}"

- name: Clean temporary Docker key download
  ansible.builtin.file:
    path: /tmp/freeboard-docker.asc
    state: absent
