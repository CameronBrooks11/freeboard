---
- name: Provision Freeboard kiosk hosts
  hosts: "{{ freeboard_target_group }}"
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  pre_tasks:
    - name: Validate kiosk profile
      ansible.builtin.assert:
        that:
          - kiosk_profile in kiosk_profile_defaults
        fail_msg: "Unsupported kiosk_profile='{{ kiosk_profile }}'. Supported profiles: {{ kiosk_profile_defaults.keys() | list | join(', ') }}"
      tags:
        - always

    - name: Resolve profile defaults
      ansible.builtin.set_fact:
        kiosk_profile_selected_defaults: "{{ kiosk_profile_defaults[kiosk_profile] }}"
      tags:
        - always

    - name: Resolve effective role toggles
      ansible.builtin.set_fact:
        kiosk_enable_player: "{{ (kiosk_enable_player is not none) | ternary(kiosk_enable_player | bool, kiosk_profile_selected_defaults.kiosk_enable_player | bool) }}"
        kiosk_enable_display: "{{ (kiosk_enable_display is not none) | ternary(kiosk_enable_display | bool, kiosk_profile_selected_defaults.kiosk_enable_display | bool) }}"
        kiosk_enable_container_runtime: "{{ (kiosk_enable_container_runtime is not none) | ternary(kiosk_enable_container_runtime | bool, kiosk_profile_selected_defaults.kiosk_enable_container_runtime | bool) }}"
        kiosk_enable_boot_tuning: "{{ (kiosk_enable_boot_tuning is not none) | ternary(kiosk_enable_boot_tuning | bool, kiosk_profile_selected_defaults.kiosk_enable_boot_tuning | bool) }}"
        kiosk_enable_mongo_preload: "{{ (kiosk_enable_mongo_preload is not none) | ternary(kiosk_enable_mongo_preload | bool, kiosk_profile_selected_defaults.kiosk_enable_mongo_preload | bool) }}"
      tags:
        - always

    - name: Validate runtime dependency chain
      ansible.builtin.assert:
        that:
          - not (kiosk_enable_mongo_preload | bool) or (kiosk_enable_container_runtime | bool)
        fail_msg: "kiosk_enable_mongo_preload=true requires kiosk_enable_container_runtime=true"
      tags:
        - always

  tasks:
    - name: Run preflight checks
      ansible.builtin.include_role:
        name: kiosk_preflight
      tags:
        - preflight

    - name: Configure base kiosk runtime user and directories
      ansible.builtin.include_role:
        name: kiosk_base
      tags:
        - kiosk_base

    - name: Configure kiosk display dependencies
      ansible.builtin.include_role:
        name: kiosk_display
      when: kiosk_enable_display | bool
      tags:
        - kiosk_display

    - name: Configure optional container runtime
      ansible.builtin.include_role:
        name: container_runtime
      when: kiosk_enable_container_runtime | bool
      tags:
        - container_runtime

    - name: Configure optional Mongo preload
      ansible.builtin.include_role:
        name: mongo_preload
      when: kiosk_enable_mongo_preload | bool
      tags:
        - mongo_preload

    - name: Configure optional boot tuning and splash screen
      ansible.builtin.include_role:
        name: kiosk_boot_tuning
      when: kiosk_enable_boot_tuning | bool
      tags:
        - kiosk_boot_tuning

    - name: Configure kiosk player service
      ansible.builtin.include_role:
        name: kiosk_player
      when: kiosk_enable_player | bool
      tags:
        - kiosk_player
